<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Latar putih bersih dengan aksen merah - untuk klien/sobat -->
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEFCE8" />
      <stop offset="50%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FEF2F2" />
    </linearGradient>
    <!-- Merah Indonesia -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <!-- Kuning emas -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#DC2626" flood-opacity="0.5"/>
    </filter>
    <filter id="glowGold">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Latar terang kuning-putih squircle -->
  <rect x="12" y="12" width="488" height="488" rx="110" fill="url(#bgMain)" filter="url(#softShadow)" />
  <!-- Border merah -->
  <rect x="18" y="18" width="476" height="476" rx="104" fill="none" stroke="#DC2626" stroke-width="6" opacity="0.15" />
  <!-- Inner border kuning -->
  <rect x="28" y="28" width="456" height="456" rx="97" fill="none" stroke="#FBBF24" stroke-width="3" opacity="0.3" />

  <!-- Dekorasi sudut merah -->
  <circle cx="90" cy="90" r="40" fill="#DC2626" opacity="0.06" />
  <circle cx="422" cy="90" r="30" fill="#FBBF24" opacity="0.12" />
  <circle cx="90" cy="422" r="25" fill="#FBBF24" opacity="0.1" />
  <circle cx="422" cy="422" r="45" fill="#DC2626" opacity="0.06" />

  <!-- Huruf S besar merah -->
  <text
    x="256" y="312"
    font-family="'Arial Black', 'Helvetica Neue', sans-serif"
    font-weight="900"
    font-size="290"
    fill="url(#redGrad)"
    text-anchor="middle"
    filter="url(#glowRed)"
    letter-spacing="-5"
  >S</text>

  <!-- Garis bawah kuning tebal -->
  <rect x="142" y="326" width="228" height="12" rx="6" fill="url(#goldGrad)" filter="url(#glowGold)" />

  <!-- Badge klien - lingkaran merah kanan bawah -->
  <g filter="url(#glowRed)">
    <circle cx="390" cy="390" r="46" fill="url(#redGrad)" />
    <circle cx="390" cy="390" r="40" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.4" />
    <!-- Ikon orang / klien -->
    <circle cx="390" cy="375" r="12" fill="#FFFFFF" />
    <path d="M 366,410 Q 366,392 390,392 Q 414,392 414,410" fill="#FFFFFF" />
  </g>

  <!-- Bintang kecil kuning atas kiri -->
  <g filter="url(#glowGold)">
    <polygon
      points="122,70 127,86 144,86 131,96 136,112 122,103 108,112 113,96 100,86 117,86"
      fill="#FBBF24"
      opacity="0.9"
    />
  </g>
</svg>
