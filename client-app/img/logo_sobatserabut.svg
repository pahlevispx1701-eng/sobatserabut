<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FEF2F2" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7F1D1D" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ikon S squircle merah di kiri - klien versi terang -->
  <rect x="10" y="15" width="170" height="170" rx="38" fill="url(#bgLight)" stroke="#DC2626" stroke-width="3" filter="url(#shadow)" />
  <text x="95" y="138" font-family="'Arial Black', sans-serif" font-weight="900" font-size="130" fill="url(#redGrad)" text-anchor="middle" letter-spacing="-3">S</text>
  <rect x="48" y="150" width="94" height="6" rx="3" fill="url(#goldGrad)" />

  <!-- Teks Brand -->
  <text x="200" y="95" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="68" fill="url(#redGrad)" letter-spacing="-2">Sobat</text>
  <text x="200" y="168" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="60" fill="#1E293B" letter-spacing="-1">Serabut</text>

  <!-- Garis bawah kuning aksen -->
  <rect x="200" y="176" width="340" height="6" rx="3" fill="url(#goldGrad)" />

  <!-- Tagline kanan -->
  <text x="555" y="80" font-family="'Arial', sans-serif" font-weight="700" font-size="20" fill="#DC2626" letter-spacing="0.5">Butuh Bantuan?</text>
  <text x="555" y="108" font-family="'Arial', sans-serif" font-weight="600" font-size="16" fill="#64748B">Kami Siap Membantu Anda</text>
  <text x="555" y="132" font-family="'Arial', sans-serif" font-weight="500" font-size="14" fill="#94A3B8">Jasa Serabutan Terpercaya 🇮🇩</text>
  
  <!-- Stars rating -->
  <text x="555" y="160" font-family="'Arial', sans-serif" font-size="20" fill="#FBBF24">★★★★★</text>
</svg>
