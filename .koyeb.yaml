name: sobatserabut
services:
  - name: web
    type: web
    git:
      repository: github.com/pahlevispx1701-eng/sobatserabut
      branch: main
    build:
      buildpack:
        build_command: "npm install --omit=dev && cd backend && npm install --omit=dev"
        run_command: "node app.js"
    ports:
      - port: 8000
        protocol: http
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
