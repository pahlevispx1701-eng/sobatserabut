<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#E63030"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="textG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#16213E"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7B0000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ===== IKON KIRI ===== -->
  <!-- Background bulat merah -->
  <rect x="10" y="10" width="120" height="120" rx="28" fill="url(#iconBg)" filter="url(#iconShadow)"/>
  <!-- Highlight -->
  <ellipse cx="48" cy="36" rx="40" ry="24" fill="#FFFFFF" fill-opacity="0.1"/>

  <!-- Wrench kiri dalam ikon -->
  <g transform="translate(70,70) rotate(-32)">
    <rect x="-7" y="-44" width="14" height="58" rx="7" fill="white" fill-opacity="0.92"/>
    <rect x="-17" y="-56" width="34" height="22" rx="6" fill="white" fill-opacity="0.92"/>
    <ellipse cx="0" cy="-45" rx="7" ry="7" fill="#E63030"/>
    <rect x="10" y="-62" width="7" height="10" rx="3" fill="white" fill-opacity="0.92"/>
    <rect x="-17" y="-62" width="7" height="10" rx="3" fill="white" fill-opacity="0.92"/>
  </g>
  <!-- Screwdriver kanan dalam ikon -->
  <g transform="translate(70,70) rotate(32)">
    <rect x="-6" y="-44" width="12" height="56" rx="6" fill="white" fill-opacity="0.92"/>
    <rect x="-10" y="-58" width="20" height="8" rx="4" fill="url(#goldG)"/>
    <rect x="-9" y="14" width="18" height="22" rx="6" fill="white" fill-opacity="0.85"/>
    <rect x="-5" y="17" width="10" height="3" rx="1.5" fill="#E63030" fill-opacity="0.5"/>
    <rect x="-5" y="23" width="10" height="3" rx="1.5" fill="#E63030" fill-opacity="0.5"/>
    <rect x="-5" y="29" width="10" height="3" rx="1.5" fill="#E63030" fill-opacity="0.5"/>
  </g>
  <!-- Lingkaran emas tengah ikon -->
  <circle cx="70" cy="70" r="18" fill="url(#goldG)" filter="url(#glow)"/>
  <circle cx="70" cy="70" r="13" fill="#C0392B"/>
  <text x="70" y="76" font-family="Arial Black, sans-serif" font-size="15" font-weight="900" text-anchor="middle" fill="white">S</text>

  <!-- ===== TEKS BRAND ===== -->
  <!-- "Sobat" merah tebal -->
  <text x="148" y="73" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" fill="#DC2626" letter-spacing="-1.5">Sobat</text>
  <!-- "Serabut" dark dengan garis bawah merah -->
  <text x="148" y="115" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#1F2937" letter-spacing="0.5">Serabut</text>
  <!-- Aksen garis merah di bawah "Serabut" -->
  <rect x="148" y="121" width="220" height="4" rx="2" fill="url(#iconBg)"/>
  <!-- Tagline kecil -->
  <text x="148" y="136" font-family="Arial, sans-serif" font-size="11" fill="#6B7280" letter-spacing="1.5">SOLUSI JASA HARIAN TERPERCAYA</text>

  <!-- Aksen bintang kecil -->
  <g filter="url(#glow)">
    <circle cx="536" cy="52" r="6" fill="url(#goldG)"/>
    <circle cx="550" cy="70" r="4" fill="#FFB300" fill-opacity="0.7"/>
    <circle cx="536" cy="88" r="5" fill="url(#goldG)"/>
  </g>
  <!-- Dot separator dekoratif -->
  <circle cx="141" cy="70" r="3" fill="#DC2626"/>
  <circle cx="141" cy="108" r="2.5" fill="#DC2626" fill-opacity="0.5"/>
</svg>
