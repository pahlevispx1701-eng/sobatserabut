plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sobatserabut.mitra'
    compileSdk 34

    defaultConfig {
        applicationId "com.sobatserabut.mitra"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Tidak menggunakan suffix agar package ID tetap sama antara debug & release
            // sehingga icon launcher dapat ditemukan dan diklik dengan benar
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android standard libraries
}
