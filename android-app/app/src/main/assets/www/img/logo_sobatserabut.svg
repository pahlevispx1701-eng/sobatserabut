<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal Shield Badge -->
    <path d="M 50,2 L 94,24 L 94,76 L 50,98 L 6,76 L 6,24 Z" 
          fill="url(#blueGrad)" filter="url(#shadow)" stroke="#60A5FA" stroke-width="2.5" />
    
    <!-- Accent Ring / Ribbon -->
    <path d="M 50,14 L 84,31 L 84,69 L 50,86 L 16,69 L 16,31 Z" 
          fill="none" stroke="#DBEAFE" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6"/>

    <!-- Dynamic Wrench & Flash Icon in Gold -->
    <!-- Wrench head -->
    <path d="M 36,36 L 46,26 C 52,20 62,22 66,28 C 69,32 68,38 64,42 L 58,48 L 68,58 C 70,60 70,64 67,67 C 64,70 60,70 58,68 L 48,58 L 42,64 C 38,68 32,69 28,66 C 22,62 20,52 26,46 Z" 
          fill="url(#amberGrad)" />
    <!-- Lightning bolt inside -->
    <polygon points="52,28 41,47 50,47 45,67 60,45 50,45" fill="#FFFFFF" />
    <!-- Center Dot / Handshake node -->
    <circle cx="50" cy="50" r="3.5" fill="#1E3A8A" />
  </g>

  <!-- Typography: SOBAT SERABUT -->
  <text x="125" y="58" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="40" letter-spacing="-1">
    <tspan fill="#1E293B">Sobat</tspan><tspan fill="#2563EB">Serabut</tspan>
  </text>
  
  <!-- Slogan / Subtitle -->
  <rect x="125" y="70" width="70" height="20" rx="4" fill="#FEF3C7" />
  <text x="131" y="84" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="11" fill="#B45309" letter-spacing="0.5">MITRA ON</text>
  <text x="205" y="84" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="13" fill="#64748B">Solusi Jasa &amp; Serabutan Cepat</text>
</svg>
