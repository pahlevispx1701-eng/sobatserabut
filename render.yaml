services:
  - type: web
    name: sobatserabut
    env: node
    plan: free
    buildCommand: npm install --omit=dev && cd backend && npm install --omit=dev
    startCommand: node app.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
