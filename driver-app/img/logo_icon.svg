<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="#60A5FA" stroke-width="4" opacity="0.4" />

  <!-- Shield Badge -->
  <g filter="url(#glow)">
    <path d="M 256,60 L 416,130 L 416,270 C 416,360 256,440 256,440 C 256,440 96,360 96,270 L 96,130 Z" 
          fill="#0F172A" opacity="0.25" />
    <path d="M 256,68 L 406,134 L 406,264 C 406,348 256,424 256,424 C 256,424 106,348 106,264 L 106,134 Z" 
          fill="#1E3A8A" stroke="#93C5FD" stroke-width="6" />
  </g>

  <!-- Golden Wrench & Gear Graphic -->
  <g transform="translate(146, 130)">
    <!-- Diagonal Wrench -->
    <path d="M 50,50 L 75,25 C 90,10 115,15 125,30 C 132,40 130,55 120,65 L 105,80 L 160,135 C 168,143 168,155 160,163 C 152,171 140,171 132,163 L 77,108 L 62,123 C 52,133 37,135 27,128 C 12,118 7,93 22,78 Z" 
          fill="url(#goldGrad)" filter="url(#glow)" />
    
    <!-- Lightning Bolt Flash -->
    <polygon points="120,30 90,95 125,95 100,165 155,90 120,90" fill="#FFFFFF" />
  </g>

  <!-- Text "S" in small badge -->
  <circle cx="256" cy="360" r="32" fill="#F59E0B" stroke="#FFFFFF" stroke-width="4" />
  <text x="256" y="373" font-family="'Inter', sans-serif" font-weight="900" font-size="36" fill="#1E3A8A" text-anchor="middle">S</text>
</svg>
