<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Latar merah-putih gradient -->
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="55%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <!-- Kuning emas -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <!-- Putih lembut -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <!-- Shadow halus -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7F1D1D" flood-opacity="0.4"/>
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
    <filter id="innerShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Latar squircle merah -->
  <rect x="12" y="12" width="488" height="488" rx="110" fill="url(#bgMain)" filter="url(#softShadow)" />
  <!-- Border luar putih tipis -->
  <rect x="18" y="18" width="476" height="476" rx="104" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.25" />

  <!-- Lingkaran putih besar sebagai "kepercayaan" area -->
  <circle cx="256" cy="230" r="158" fill="#FFFFFF" opacity="0.08" />

  <!-- Elemen bintang / percikan kecil (kepercayaan) -->
  <circle cx="108" cy="108" r="6" fill="#FBBF24" opacity="0.7" />
  <circle cx="404" cy="108" r="4" fill="#FBBF24" opacity="0.5" />
  <circle cx="90" cy="380" r="5" fill="#FFFFFF" opacity="0.3" />
  <circle cx="420" cy="370" r="7" fill="#FBBF24" opacity="0.6" />
  <circle cx="150" cy="440" r="3" fill="#FFFFFF" opacity="0.4" />
  <circle cx="362" cy="450" r="4" fill="#FBBF24" opacity="0.4" />

  <!-- Huruf S besar modern - putih dengan outline kuning emas -->
  <text
    x="256" y="310"
    font-family="'Arial Black', 'Helvetica Neue', sans-serif"
    font-weight="900"
    font-size="285"
    fill="url(#whiteGrad)"
    text-anchor="middle"
    filter="url(#innerShadow)"
    letter-spacing="-5"
  >S</text>

  <!-- Garis bawah aksent kuning (underline trust) -->
  <rect x="148" y="325" width="220" height="10" rx="5" fill="url(#goldGrad)" filter="url(#glowGold)" />

  <!-- Badge bintang kepercayaan di pojok kanan bawah -->
  <g filter="url(#glowGold)">
    <circle cx="390" cy="390" r="46" fill="url(#goldGrad)" />
    <circle cx="390" cy="390" r="40" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5" />
    <!-- Bintang 5 titik kecil -->
    <polygon
      points="390,358 397,381 422,381 402,396 409,419 390,405 371,419 378,396 358,381 383,381"
      fill="#FFFFFF"
      opacity="0.95"
    />
  </g>

  <!-- Titik merah kecil di pojok kiri atas (identitas brand) -->
  <circle cx="122" cy="390" r="30" fill="#FFFFFF" opacity="0.12" />
  <circle cx="122" cy="390" r="18" fill="#FBBF24" opacity="0.7" />
</svg>
