<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#7F1D1D" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ikon S squircle kecil di kiri -->
  <rect x="10" y="15" width="170" height="170" rx="38" fill="url(#redGrad)" filter="url(#shadow)" />
  <rect x="16" y="21" width="158" height="158" rx="32" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.2" />
  <text x="95" y="135" font-family="'Arial Black', sans-serif" font-weight="900" font-size="130" fill="#FFFFFF" text-anchor="middle" letter-spacing="-3">S</text>
  <rect x="48" y="148" width="94" height="6" rx="3" fill="url(#goldGrad)" />

  <!-- Teks Brand -->
  <text x="200" y="95" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="68" fill="url(#redGrad)" letter-spacing="-2">Sobat</text>
  <text x="200" y="168" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="60" fill="#1E293B" letter-spacing="-1">Serabut</text>

  <!-- Garis bawah kuning aksen -->
  <rect x="200" y="175" width="340" height="6" rx="3" fill="url(#goldGrad)" />

  <!-- Tagline kecil -->
  <text x="555" y="85" font-family="'Arial', sans-serif" font-weight="600" font-size="18" fill="#DC2626" letter-spacing="1">JUJUR · AMANAH</text>
  <text x="555" y="115" font-family="'Arial', sans-serif" font-weight="500" font-size="15" fill="#64748B">Jasa Serabutan Terpercaya</text>
  <text x="555" y="140" font-family="'Arial', sans-serif" font-weight="500" font-size="13" fill="#94A3B8">Indonesia 🇮🇩</text>
</svg>
