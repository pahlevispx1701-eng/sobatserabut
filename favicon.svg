<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient: merah-oranye premium -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="40%" stop-color="#E63030"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <!-- Accent glow gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <!-- Highlight untuk tools -->
    <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F3F4F6" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Inner shadow untuk depth -->
    <linearGradient id="innerShad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#7B0000" flood-opacity="0.55"/>
    </filter>
    <!-- Glow untuk bintang/aksen -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Clip rounded square -->
    <clipPath id="rounded">
      <rect x="24" y="24" width="464" height="464" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- Background rounded square dengan shadow -->
  <rect x="24" y="24" width="464" height="464" rx="110" ry="110" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <!-- Inner overlay untuk depth -->
  <rect x="24" y="24" width="464" height="464" rx="110" ry="110" fill="url(#innerShad)"/>
  <!-- Highlight top-left blink -->
  <ellipse cx="150" cy="120" rx="160" ry="100" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- ============================================================
       IKON: Dua tangan berjabat + tools (melambangkan jasa & mitra)
       ============================================================ -->

  <!-- Wrench kiri (miring ke kiri-atas) -->
  <g transform="translate(256,256) rotate(-35)">
    <!-- Batang wrench -->
    <rect x="-16" y="-110" width="32" height="145" rx="16" fill="url(#toolGrad)"/>
    <!-- Kepala wrench -->
    <rect x="-38" y="-140" width="76" height="50" rx="12" fill="url(#toolGrad)"/>
    <!-- Lubang tengah kepala -->
    <ellipse cx="0" cy="-115" rx="16" ry="16" fill="url(#bgGrad)"/>
    <!-- Kanan atas kepala -->
    <rect x="22" y="-148" width="16" height="22" rx="7" fill="url(#toolGrad)"/>
    <!-- Kiri atas kepala -->
    <rect x="-38" y="-148" width="16" height="22" rx="7" fill="url(#toolGrad)"/>
  </g>

  <!-- Kunci inggris / screwdriver kanan (miring ke kanan-atas) -->
  <g transform="translate(256,256) rotate(35)">
    <!-- Batang -->
    <rect x="-14" y="-110" width="28" height="140" rx="14" fill="url(#toolGrad)"/>
    <!-- Handle bawah -->
    <rect x="-22" y="28" width="44" height="55" rx="14" fill="url(#toolGrad)"/>
    <!-- Ujung minus (screwdriver head) -->
    <rect x="-26" y="-138" width="52" height="18" rx="9" fill="url(#goldGrad)"/>
    <!-- Garis tengah handle -->
    <rect x="-14" y="38" width="28" height="6" rx="3" fill="#E63030" fill-opacity="0.4"/>
    <rect x="-14" y="52" width="28" height="6" rx="3" fill="#E63030" fill-opacity="0.4"/>
    <rect x="-14" y="66" width="28" height="6" rx="3" fill="#E63030" fill-opacity="0.4"/>
  </g>

  <!-- Lingkaran tengah: simbol persatuan/jabat tangan -->
  <circle cx="256" cy="256" r="52" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="38" fill="url(#bgGrad)"/>
  <!-- Huruf S stylish di tengah -->
  <text x="256" y="275" font-family="Arial Black, Helvetica, sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="-2">S</text>

  <!-- Bintang aksen kecil kanan-atas -->
  <g filter="url(#glow)">
    <polygon points="390,82 398,106 424,106 403,120 411,144 390,130 369,144 377,120 356,106 382,106" fill="url(#goldGrad)" transform="scale(0.7) translate(167,37)"/>
  </g>
  <!-- Titik aksen kiri bawah -->
  <circle cx="110" cy="400" r="10" fill="#FFB300" fill-opacity="0.6" filter="url(#glow)"/>
  <circle cx="134" cy="418" r="6" fill="#FFB300" fill-opacity="0.4"/>
  <!-- Titik aksen kanan bawah -->
  <circle cx="402" cy="400" r="8" fill="#FFE082" fill-opacity="0.5" filter="url(#glow)"/>
</svg>
